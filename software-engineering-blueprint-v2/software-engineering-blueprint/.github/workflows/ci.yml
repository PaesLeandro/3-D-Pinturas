name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Blueprint baseline
        shell: bash
        run: bash software-engineering-blueprint/scripts/validate-project.sh || bash scripts/validate-project.sh

  # Add stack-specific jobs after project discovery.
  # Examples: Maven/Gradle verify, npm/pnpm lint+test+build, etc.
